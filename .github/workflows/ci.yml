name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: runbill demo

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests --select F,E9

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Install the wheel in a clean venv and smoke-test it
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/runbill --version
          /tmp/v/bin/runbill demo

  real-repo:
    name: meter a real repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: meter
        uses: ./
        with:
          repo: Blackman99/certfan
          days: "14"
          top: "5"
          by: "branch,event"
      - name: Check the JSON report (and that --by tables add up to the total)
        run: |
          python3 - "${{ steps.meter.outputs.report }}" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(d["runs"], d["total"]["billed_minutes"], len(d["branches"]), "branches", len(d["events"]), "events")
          assert d["runs"] > 0
          for key in ("branches", "events"):
              assert abs(sum(x["billed_minutes"] for x in d[key]) - d["total"]["billed_minutes"]) < 0.01, key
          PY
      - id: diff
        uses: ./
        with:
          repo: Blackman99/runbill
          days: "7"
          top: "5"
          compare: "true"
          fail-increase: "100000"
      - name: Check the --compare JSON (both windows, and per-workflow deltas that add up)
        run: |
          python3 - "${{ steps.diff.outputs.report }}" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          p, c = d["compare"]["previous"], d["compare"]["current"]
          print(p["from"], p["runs"], "runs ->", c["from"], c["runs"], "runs;", d["total"]["delta"])
          assert p["to"] == c["from"] and p["days"] == c["days"] == 7
          dt = sum(w["delta"]["billed_minutes"] for w in d["workflows"])
          assert abs(dt - d["total"]["delta"]["billed_minutes"]) < 0.01
          assert all(w["status"] in ("new", "gone", "up", "down", "flat") for w in d["workflows"])
          PY
